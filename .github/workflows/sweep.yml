name: mapillary-sweep

# Runs a slice of the global coverage sweep once a day and commits the result.
# A full global pass spans ~2-3 weeks of daily runs (see ARCHIVE.md), then repeats.

on:
  schedule:
    - cron: "17 * * * *" 
  workflow_dispatch: {}          # also runnable on demand from the Actions tab

permissions:
  contents: write                # needed to commit the snapshot back to the repo

concurrency:
  group: mapillary-sweep         # never let two runs overlap
  cancel-in-progress: false

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 30            # hard ceiling; the script also self-stops sooner
    steps:
      - name: Random-slot gate
        id: gate
        run: |
          python3 - <<'EOF'
          import os, random, datetime as dt
          # ---- config ----
          RUNS_PER_WEEK = 3
          # ----------------
          now = dt.datetime.now(dt.timezone.utc)
          if os.environ["GITHUB_EVENT_NAME"] == "workflow_dispatch":
              go = True                                   # manual runs always go
          else:
              y, w, _ = now.isocalendar()
              rng = random.Random(f"{y}-{w}")             # same picks all week
              days = rng.sample(range(7), RUNS_PER_WEEK)  # 0=Mon ... 6=Sun
              slots = {d: rng.randrange(24) for d in days}
              go = slots.get(now.weekday()) == now.hour
              print("this week's slots (weekday: UTC hour):", slots)
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"run={'true' if go else 'false'}\n")
          print("run =", go)
          EOF

      - uses: actions/checkout@v4
        if: steps.gate.outputs.run == 'true'

      - uses: actions/setup-python@v5
        if: steps.gate.outputs.run == 'true'
        with:
          python-version: "3.12"

      - run: pip install mapbox-vector-tile matplotlib
        if: steps.gate.outputs.run == 'true'

      - name: Run sweep
        if: steps.gate.outputs.run == 'true'
        env:
          MAPILLARY_TOKEN: ${{ secrets.MAPILLARY_TOKEN }}
        run: python -u sweep.py

      - name: Build stats for the README
        if: always() && steps.gate.outputs.run == 'true'
        run: python -u stats.py

      - name: Commit snapshot
        if: always() && steps.gate.outputs.run == 'true'
        run: |
          git config user.name  "pyaritra"
          git config user.email "65927743+pyaritra@users.noreply.github.com"
          git add archive stats
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "sweep $(date -u +%F)"
            git pull --rebase --autostash
            git push
          fi
